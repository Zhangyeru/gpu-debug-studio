# GPU Debug Studio — Nginx 反向代理配置
#
# 使用方式：
#   sudo cp nginx.conf /etc/nginx/sites-available/gpu-debug-studio
#   sudo ln -s /etc/nginx/sites-available/gpu-debug-studio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo nginx -s reload
#
# 架构：
#   /api/*   → proxy_pass http://127.0.0.1:8000  (FastAPI 后端)
#   /health  → proxy_pass http://127.0.0.1:8000  (健康检查)
#   /*       → 静态文件 dist/

server {
    listen 80;
    server_name localhost;

    # 前端静态文件目录（npm run build 输出）
    root /home/anfield/project/gpu-debug-studio/dist;
    index index.html;

    # 日志
    access_log /var/log/nginx/gpu-debug-studio-access.log;
    error_log  /var/log/nginx/gpu-debug-studio-error.log;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # API 请求代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 分析可能耗时较长（复杂 Shader 需要 2-3 分钟）
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # SPA 路由：所有非 API 非静态文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
