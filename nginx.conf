# GPU Debug Studio — Nginx 反向代理配置
#
# 使用方式：
#   # 1. 必须先修复权限，否则 nginx 用户无法读取 dist/ 文件
#   sudo chmod o+x /home/anfield
#   # 2. 部署配置
#   sudo cp nginx.conf /etc/nginx/sites-available/gpu-debug-studio
#   sudo ln -s /etc/nginx/sites-available/gpu-debug-studio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl restart nginx
#
# 注意：如果 /home/anfield 权限为 700，nginx 的 www-data 用户无法遍历目录，
# 会返回 404 Not Found。用 chmod o+x 或修改 /etc/nginx/nginx.conf 的 user 解决。
#
# 架构：
#   /api/*   → proxy_pass http://127.0.0.1:8002  (FastAPI 后端)
#   /health  → proxy_pass http://127.0.0.1:8002  (健康检查)
#   /*       → 静态文件 dist/

server {
    listen 80;
    server_name _;   # 接受所有域名/IP 访问（localhost、局域网 IP 等）

    # 前端静态文件目录（npm run build 输出）
    root /home/anfield/project/gpu-debug-studio/dist;
    index index.html;

    # 日志
    access_log /var/log/nginx/gpu-debug-studio-access.log;
    error_log  /var/log/nginx/gpu-debug-studio-error.log;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # API 请求代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 分析可能耗时较长（复杂 Shader 需要 2-3 分钟）
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
    }

    # SPA 路由：所有非 API 非静态文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
